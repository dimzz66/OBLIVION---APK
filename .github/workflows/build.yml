name: Build OBLIVION APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OBLIVION-Android-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir project
          unzip OBLIVION-Android-Project.zip -d project
          echo "PROJECT_DIR=$(dirname "$(find project -name settings.gradle -print -quit)")" >> $GITHUB_ENV

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OBLIVION-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
